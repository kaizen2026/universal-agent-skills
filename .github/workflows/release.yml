name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing package version to tag
        required: true
        default: v1.0.0
      compatibility_matrix_confirmed:
        description: Confirm Codex, Claude Code, Cursor, Copilot, and Antigravity matrix evidence was reviewed
        required: true
        type: boolean
        default: false

concurrency: release-${{ github.ref }}

jobs:
  release:
    if: inputs.compatibility_matrix_confirmed
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run compatibility gate
        run: npm test && npm run test:installer

      - name: Verify requested version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node -e "const p=require('./package.json'); if ('v'+p.version !== process.env.RELEASE_VERSION) throw new Error('package version '+p.version+' does not match '+process.env.RELEASE_VERSION)"
          if git rev-parse "$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "$RELEASE_VERSION already exists"
            exit 1
          fi

      - name: Tag and publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          git tag -a "$RELEASE_VERSION" -m "Universal Agent Skills $RELEASE_VERSION"
          git push origin "$RELEASE_VERSION"
          gh release create "$RELEASE_VERSION" --generate-notes --title "Universal Agent Skills $RELEASE_VERSION"
